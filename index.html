<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Magic Hearts Canvas ✨</title>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #fff0f5;
            font-family: 'Courier New', Courier, monospace;
        }
        .title-container {
            position: absolute;
            top: 50%;
            left: 0;
            width: 100%;
            transform: translateY(-50%);
            pointer-events: none;
            z-index: 10;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .title-container h1 {
            color: #db7093;
            font-size: 2.5rem;
            margin: 0;
            text-align: center;
            user-select: none;
            white-space: nowrap;
            width: 100%;
        }
        canvas {
            position: absolute;
            top: 0;
            left: 0;
            display: block;
            z-index: 1;
        }
    </style>
</head>
<body>

    <div class="title-container">
        <h1>Move your mouse around ✨</h1>
    </div>

    <canvas id="heartCanvas"></canvas>

    <script src="script.js"></script>
</body>
</html>
